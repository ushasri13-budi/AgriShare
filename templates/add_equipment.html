 <!DOCTYPE html>
<html>
<head>
<title>Add Equipment | AgriShare</title>
</head>

<body>

<h1>Add Agricultural Equipment 🚜</h1>

<form method="POST">

<input type="text" name="name" placeholder="Equipment Name" required><br><br>

<input type="text" name="category" placeholder="Category" required><br><br>

<textarea name="description" placeholder="Description"></textarea><br><br>

<input type="number" name="price" placeholder="Price per hour" required><br><br>

<input type="text" name="location" placeholder="Location" required><br><br>

<button type="submit">Add Equipment</button>

</form>

</body>
</html>
