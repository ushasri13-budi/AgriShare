 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AgriShare</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="login-page">

    <div class="login-left">
        <h1>🌾 AgriShare</h1>
        <h2>Welcome Back!</h2>
        <p>Login to rent agricultural equipment and manage your bookings easily.</p>

        <img src="{{ url_for('static', filename='images/farmer.png') }}" alt="Farmer">
    </div>

    <div class="login-right">

        <form class="login-form" action="{{ url_for('login') }}" method="POST">

            <h2>Login</h2>

            <input type="email" name="email" placeholder="Email Address" required>

            <input type="password" name="password" placeholder="Password" required>

            <div class="login-options">
               <label class="remember">
    <input type="checkbox">
    <span>Remember Me</span>
</label>

                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit">Login</button>

            <p>
                Don't have an account?
                <a href="{{ url_for('register') }}">Register</a>
            </p>

        </form>

    </div>

</div>

</body>
</html>
